name: Gerar e publicar instalador

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Conferir versão da tag
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version

          if ($tagVersion -ne $packageVersion) {
            throw "A tag v$tagVersion não corresponde à versão $packageVersion do package.json."
          }

      - name: Gerar instalador
        run: npx electron-builder --win nsis --publish never

      - name: Conferir arquivos gerados
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Recurse

          $exe = Get-Item "dist/Nith-ERP-Setup.exe"
          $blockmap = Get-Item "dist/Nith-ERP-Setup.exe.blockmap"
          $latest = Get-Item "dist/latest.yml"

          if (-not $exe) {
            throw "O instalador EXE não foi gerado."
          }

          if (-not $blockmap) {
            throw "O arquivo blockmap não foi gerado."
          }

          if (-not $latest) {
            throw "O arquivo latest.yml não foi gerado."
          }

      - name: Publicar arquivos no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: Nith ERP ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Nith-ERP-Setup.exe
            dist/Nith-ERP-Setup.exe.blockmap
            dist/latest.yml