<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nith ERP</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #18324a 0%, #0b1220 70%);
      border-radius: 18px;
      color: #fff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    img {
      width: 440px;
      height: auto;
      filter: drop-shadow(0 6px 24px rgba(43, 183, 246, 0.35));
      animation: pulse 2.2s ease-in-out infinite;
    }

    .spinner {
      margin-top: 34px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #2bb7f6;
      animation: spin 0.9s linear infinite;
    }

    .text {
      margin-top: 18px;
      font-size: 13px;
      letter-spacing: 2px;
      color: #9bb8d0;
      text-transform: uppercase;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: 0.9; }
    }
  </style>
</head>
<body>
  <img src="logo.png" alt="Nith ERP" />
  <div class="spinner"></div>
  <div class="text">Carregando…</div>
</body>
</html>
